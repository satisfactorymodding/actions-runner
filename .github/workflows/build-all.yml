name: build-all

on:
  workflow_dispatch:
    inputs:
      wine-branch:
        description: 'Wine branch'
        required: false
        default: 'stable'
      wine-version:
        description: 'Wine version'
        required: false
        default: '11.0'
      msvc-version:
        description: 'MSVC version'
        required: false
        default: '17.8'
      win-sdk-version:
        description: 'Windows SDK version'
        required: false
        default: '10.0.22621'
      ue-branch:
        description: 'UE branch to cache dependencies for (default: UE repo default branch)'
        required: false
        default: ''
      ue-tag:
        description: 'UE tag (default: latest UE release)'
        required: false
        default: ''
      wwise-sdk-version:
        description: 'WWISE SDK version'
        required: false
        default: '2025.1.6.9117'

jobs:
  build:
    runs-on: arc-k8s
    steps:
      - uses: actions/checkout@v7

      - name: Resolve UE branch and tag
        id: ue
        uses: actions/github-script@v7
        env:
          UE_BRANCH: ${{ inputs.ue-branch }}
          UE_TAG: ${{ inputs.ue-tag }}
        with:
          github-token: ${{ secrets.BOT_TOKEN }}
          script: |
            const repo = { owner: 'satisfactorymodding', repo: 'UnrealEngine' };
            const branch = process.env.UE_BRANCH || (await github.rest.repos.get(repo)).data.default_branch;
            const tag = process.env.UE_TAG || (await github.rest.repos.getLatestRelease(repo)).data.tag_name;
            core.setOutput('branch', branch);
            core.setOutput('tag', tag);

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: tcp://127.0.0.1:1234

      - name: Build
        uses: docker/bake-action@v7
        with:
          source: .
          push: false
        env:
          WINE_BRANCH: ${{ inputs.wine-branch }}
          WINE_VERSION: ${{ inputs.wine-version }}
          MSVC_VERSION: ${{ inputs.msvc-version }}
          WIN_SDK_VERSION: ${{ inputs.win-sdk-version }}
          UE_COMMITISH: ${{ steps.ue.outputs.branch }}
          UE_VERSION: ${{ steps.ue.outputs.tag }}
          WWISE_SDK_VERSION: ${{ inputs.wwise-sdk-version }}
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
          WWISE_EMAIL: ${{ secrets.WWISE_EMAIL }}
          WWISE_PASSWORD: ${{ secrets.WWISE_PASSWORD }}
