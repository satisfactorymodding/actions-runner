name: sml-build

on:
  workflow_dispatch:
    inputs:
      wine-branch:
        description: 'Wine branch'
        required: false
        default: 'stable'
      wine-version:
        description: 'Wine version'
        required: false
        default: '11.0'
      msvc-version:
        description: 'MSVC version'
        required: false
        default: '17.8'
      win-sdk-version:
        description: 'Windows SDK version'
        required: false
        default: '10.0.22621'
      ue-tag:
        description: 'UE tag'
        required: false
        default: ''
      wwise-sdk-version:
        description: 'WWISE SDK version'
        required: false
        default: '2025.1.6.9117'

jobs:
  docker:
    runs-on: arc-k8s
    steps:
      - uses: actions/checkout@v7

      - name: Get UE release tag
        id: ue-tag
        uses: actions/github-script@v7
        env:
          UE_TAG: ${{ inputs.ue-tag }}
        with:
          github-token: ${{ secrets.BOT_TOKEN }}
          script: |
            const tag = process.env.UE_TAG;
            if (tag) {
              core.setOutput('tag', tag);
            } else {
              const release = await github.rest.repos.getLatestRelease({
                owner: 'satisfactorymodding',
                repo: 'UnrealEngine',
              });
              core.setOutput('tag', release.data.tag_name);
            }

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.REGISTRY_URL }}/${{ github.repository }}-sml-build
          tags: |
            type=raw,value=wine-${{ inputs.wine-branch }}-${{ inputs.wine-version }}-msvc-${{ inputs.msvc-version }}-win-sdk-${{ inputs.win-sdk-version }}-ue-${{ steps.ue-tag.outputs.tag }}-wwise-${{ inputs.wwise-sdk-version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: tcp://127.0.0.1:1234

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: sml-build.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ secrets.REGISTRY_URL }}/${{ github.repository }}-base:wine-${{ inputs.wine-branch }}-${{ inputs.wine-version }}-msvc-${{ inputs.msvc-version }}-win-sdk-${{ inputs.win-sdk-version }}
            UE_VERSION=${{ steps.ue-tag.outputs.tag }}
            WWISE_SDK_VERSION=${{ inputs.wwise-sdk-version }}
          secrets: |
            GH_TOKEN=${{ secrets.BOT_TOKEN }}
            WWISE_EMAIL=${{ secrets.WWISE_EMAIL }}
            WWISE_PASSWORD=${{ secrets.WWISE_PASSWORD }}
